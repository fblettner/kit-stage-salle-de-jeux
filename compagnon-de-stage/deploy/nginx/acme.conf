# Le portier provisoire du tout premier déploiement : il répond seulement à Let's Encrypt,
# qui vérifie qu'on est bien le propriétaire du domaine avant de donner le certificat HTTPS.
# (${DOMAINE} est remplacé par ton domaine au démarrage, voir docker-compose.yml)
server {
    listen 80;
    server_name ${DOMAINE};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
