# nginx est le « portier » : il reçoit les visiteurs, s'occupe du HTTPS et transmet au compagnon.
# (${DOMAINE} est remplacé par ton domaine au démarrage, voir docker-compose.yml)

# En HTTP : on répond à Let's Encrypt (renouvellement du certificat), et on renvoie tout le reste vers HTTPS
server {
    listen 80;
    server_name ${DOMAINE};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${DOMAINE}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAINE};

    ssl_certificate /etc/letsencrypt/live/${DOMAINE}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAINE}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # En-têtes de sécurité. SAMEORIGIN (et pas DENY) : le compagnon affiche la salle de jeux dans un cadre de son propre site.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://compagnon:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Toute autre adresse qui arrive ici (l'IP du serveur, un autre nom) : on ne répond pas
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
