# Construit l'image Docker du compagnon de stage (avec les 4 jeux d'exemple) et la range dans
# le registre de GitHub (ghcr.io). La VM n'a plus qu'à la télécharger : plus besoin de construire sur place.
#
# - à chaque « push » sur main : tests, puis image publiée avec l'étiquette « latest »
# - sur une « pull request » : tests et construction seulement, pour vérifier (rien n'est publié)
# - bouton « Run workflow » de l'onglet Actions : pour relancer à la main
name: Image du compagnon

on:
  push:
    branches: [main]
    paths-ignore:
      - "compagnon-de-stage/captures/**"
      - ".vscode/**"
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests du compagnon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les paquets Python
        working-directory: compagnon-de-stage/backend
        run: pip install -e ".[dev]"
      - name: Lancer les tests
        working-directory: compagnon-de-stage/backend
        run: pytest -q

  image:
    name: Construire l'image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # le droit de ranger l'image dans ghcr.io (avec le jeton fourni par GitHub, aucun secret à créer)
    steps:
      - uses: actions/checkout@v4

      # Pour construire aussi la version ARM (les VM « Ampere » d'OCI) sur une machine Intel
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Se connecter au registre de GitHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le nom et les étiquettes de l'image : ghcr.io/<compte>/<dépôt>:latest et :sha-<numéro du commit>
      - name: Préparer le nom de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Avant de publier : on démarre vraiment l'image et on vérifie qu'elle répond (le compagnon, les jeux, leur serveur).
      # Les tests ci-dessus ne voient pas les erreurs qui n'arrivent QUE dans l'image (un chemin différent, un fichier oublié).
      - name: Construire l'image pour l'essayer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compagnon-de-stage/Dockerfile
          load: true
          tags: compagnon:essai
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrer l'image et vérifier qu'elle répond
        run: |
          docker run -d --name essai -p 8000:8000 -e ANIMATEUR_MOT_DE_PASSE="un mot de passe pour l essai" compagnon:essai
          for essai in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/api/sante; then break; fi
            sleep 2
          done
          docker logs essai
          curl -sf -o /dev/null http://127.0.0.1:8000/api/sante     # le serveur des jeux, à travers le compagnon
          curl -sf -o /dev/null http://127.0.0.1:8000/               # le site du compagnon
          curl -sf -o /dev/null http://127.0.0.1:8000/jeux/          # le site des jeux
          # et, connecté comme animateur : le programme (lu dans les fichiers .md du kit) annonce bien la salle de jeux
          jeton=$(curl -sf -H 'Content-Type: application/json' -d '{"mot_de_passe":"un mot de passe pour l essai"}' \
            http://127.0.0.1:8000/api/connexion/animateur | python3 -c "import json,sys; print(json.load(sys.stdin)['jeton'])")
          curl -sf -H "Authorization: Bearer $jeton" http://127.0.0.1:8000/api/programme | grep -q '"salle": *true'

      - name: Construire (et publier si on est sur main)
        uses: docker/build-push-action@v6
        with:
          context: .                                   # la racine du kit : l'image contient les fichiers .md
          file: compagnon-de-stage/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
