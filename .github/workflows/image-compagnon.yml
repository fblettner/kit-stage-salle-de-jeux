# Construit l'image Docker du compagnon de stage (avec les 4 jeux d'exemple) et la range dans
# le registre de GitHub (ghcr.io). La VM n'a plus qu'à la télécharger : plus besoin de construire sur place.
#
# - à chaque « push » sur main : tests, puis image publiée avec l'étiquette « latest »
# - sur une « pull request » : tests et construction seulement, pour vérifier (rien n'est publié)
# - bouton « Run workflow » de l'onglet Actions : pour relancer à la main
name: Image du compagnon

on:
  push:
    branches: [main]
    paths-ignore:
      - "compagnon-de-stage/captures/**"
      - ".vscode/**"
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests du compagnon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les paquets Python
        working-directory: compagnon-de-stage/backend
        run: pip install -e ".[dev]"
      - name: Lancer les tests
        working-directory: compagnon-de-stage/backend
        run: pytest -q

  image:
    name: Construire l'image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # le droit de ranger l'image dans ghcr.io (avec le jeton fourni par GitHub, aucun secret à créer)
    steps:
      - uses: actions/checkout@v4

      # Pour construire aussi la version ARM (les VM « Ampere » d'OCI) sur une machine Intel
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Se connecter au registre de GitHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le nom et les étiquettes de l'image : ghcr.io/<compte>/<dépôt>:latest et :sha-<numéro du commit>
      - name: Préparer le nom de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Construire (et publier si on est sur main)
        uses: docker/build-push-action@v6
        with:
          context: .                                   # la racine du kit : l'image contient les fichiers .md
          file: compagnon-de-stage/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
